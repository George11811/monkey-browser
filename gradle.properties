# ---- Gradle ----
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
# IntelliJ Platform Gradle Plugin 暂不完全支持配置缓存，先关闭。
org.gradle.configuration-cache=false

# IntelliJ Platform 自带 Kotlin stdlib，禁用 Gradle Kotlin 插件自动添加的 stdlib 依赖，
# 避免运行时版本冲突（见 verifyPluginProjectConfiguration 提示）。
kotlin.stdlib.default.dependency=false

# ---- 编译目标 IDE（使用前必须自行设置）----
# 插件只依赖 IntelliJ Platform + JCEF，因此可用任意同平台分支的 IDE 安装目录作为编译目标；
# 直接复用本机已装 IDE 可省掉下载 1GB+ 的 IDE 分发包。
#
# 本属性刻意不提交进仓库 —— 它是机器相关路径。任选一种方式提供：
#   1) 用户级配置 ~/.gradle/gradle.properties（推荐，不进任何仓库）：
#        monkeyBrowser.idePath=D:/Your/IDE
#   2) 命令行传入：
#        gradlew.bat -PmonkeyBrowser.idePath="D:/Your/IDE"
#
# 未设置会在配置阶段直接失败并给出提示（有意的 fail-fast）——
# 注意报错发生在配置阶段，所以连 gradlew tasks 也会失败。